<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar STAER - Fase 2 (Final)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* CSS GERAL */
        html, body {
            height: 100%; width: 100%; margin: 0; padding: 0;
            overflow: hidden; font-family: Arial, sans-serif;
        }

        #map {
            position: absolute; top: 0; bottom: 0; left: 0; right: 0;
            height: 100%; width: 100%; z-index: 1;
            background-color: #aadaff; /* Cor do mar caso o mapa demore a carregar */
        }

        .info-box {
            position: absolute; top: 20px; right: 20px; z-index: 9999;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 15px; border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3); width: 250px;
        }

        h3 { margin-top: 0; color: #333; margin-bottom: 5px; }
        .slider-container { margin-top: 10px; border-top: 1px solid #ddd; padding-top: 10px; }
        input[type=range] { width: 100%; cursor: pointer; }
        
        .flag-icon {
            height: 20px; border-radius: 3px;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.2);
            margin-left: 10px; vertical-align: middle;
        }

        /* Estilo para suavizar a rotação do avião */
        .aviao-icon {
            transition: all 0.5s linear; /* Movimento suave */
        }
    </style>
</head>
<body>

    <div class="info-box">
        <h3>Radar STAER</h3>
        <div id="status">A ligar ao servidor...</div>
        
        <div class="slider-container">
            <label><b>Altitude Mínima:</b> <span id="valorAlt">0</span> ft</label>
            <input type="range" id="filtroAlt" min="0" max="40000" step="1000" value="0" oninput="atualizarValor(this.value)">
        </div>
        
        <div style="margin-top: 10px; font-size: 0.8em; color: #666;">
            <i>Ícones rodam com o rumo (track)</i>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- 1. Inicializar o Mapa ---
        var map = L.map('map').setView([41.15, -8.62], 9);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var markers = {}; 

        // --- 2. Ícone do Avião (SVG) ---
        // Cria um ícone rodado dinamicamente
        function criarIconeAviao(rumo, cor = "#d63031") {
            // Desenho vetorial de um avião
            const svgAviao = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="30" 
                     style="transform: rotate(${rumo}deg); filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.5));">
                    <path fill="${cor}" stroke="white" stroke-width="1" 
                          d="M21,16v-2l-8-5V3.5c0-0.83-0.67-1.5-1.5-1.5S10,2.67,10,3.5V9l-8,5v2l8-2.5V19l-2,1.5V22l3.5-1l3.5,1v-1.5L13,19v-5.5L21,16z"/>
                </svg>`;

            return L.divIcon({
                html: svgAviao,
                className: 'aviao-icon', // Classe para animar
                iconSize: [30, 30],
                iconAnchor: [15, 15], // O centro da rotação é o meio (15,15)
                popupAnchor: [0, -15]
            });
        }

        // --- 3. Função Bandeiras ---
       function obterBandeira(hex) {
            if (!hex) return '';
            let h = hex.toUpperCase();
            let pais = null;

            // --- Lógica de Prefixos ---

            // 1. Ibéria e Vizinhos
            if (h.startsWith('49')) pais = 'pt';       // Portugal (CS-...)
            else if (h.startsWith('34')) pais = 'es';  // Espanha (EC-...)
            else if (h.startsWith('38') || h.startsWith('39') || h.startsWith('3A')) pais = 'fr'; // França
            else if (h.startsWith('30')) pais = 'it';  // Itália

            // 2. Reino Unido e Irlanda
            else if (h.startsWith('40') || h.startsWith('41') || h.startsWith('42')) pais = 'gb'; // Reino Unido
            else if (h.startsWith('4C')) pais = 'ie';  // Irlanda (Ryanair, Aer Lingus)

            // 3. Central Europe (Alemanha, Suíça, Holanda...)
            else if (h.startsWith('3C') || h.startsWith('3D')) pais = 'de'; // Alemanha
            else if (h.startsWith('4B')) pais = 'ch';  // Suíça
            else if (h.startsWith('48')) {
                 // Polónia (SP-) vs Holanda (PH-)
                 // 488 a 48D costuma ser Polónia
                 let char = h[2];
                 if (char >= '8') pais = 'pl'; else pais = 'nl'; 
            }

            // 4. Casos Especiais (Prefixos Partilhados)
            
            // Áustria (OE-) vs Bélgica (OO-) -> Partilham o 44
            else if (h.startsWith('44')) {
                let char = h[2];
                if (char >= '0' && char <= '7') pais = 'at'; // Áustria
                else pais = 'be'; // Bélgica
            }

            // Luxemburgo (LX-) vs Malta (9H-) -> Partilham o 4D
            else if (h.startsWith('4D')) {
                // Malta costuma ser 4D2xxx
                if (h.startsWith('4D2')) pais = 'mt'; // Malta
                else pais = 'lu'; // Luxemburgo
            }

            // 5. Escandinávia
            else if (h.startsWith('45')) pais = 'dk';  // Dinamarca
            else if (h.startsWith('46')) pais = 'se';  // Suécia
            else if (h.startsWith('47')) pais = 'no';  // Noruega

            // 6. Resto do Mundo
            else if (h.startsWith('0D') || h.startsWith('00')) pais = 'za'; // África do Sul
            else if (h.startsWith('E4') || h.startsWith('E0')) pais = 'br'; // Brasil
            else if (h.startsWith('A')) pais = 'us';   // EUA
            else if (h.startsWith('896')) pais = 'ae'; // Emirados (Emirates)
            else if (h.startsWith('71')) pais = 'kr';  // Coreia do Sul
            else if (h.startsWith('78')) pais = 'cn';  // China
            else if (h.startsWith('C8')) pais = 'nz';  // Nova Zelândia
            else if (h.startsWith('7C')) pais = 'au';  // Austrália

            if (pais) return `<img src="https://flagcdn.com/20x15/${pais}.png" class="flag-icon" title="${pais}">`;
            return '';
        }

        function atualizarValor(val) {
            document.getElementById('valorAlt').innerText = val;
            atualizarMapa();
        }

        // --- 4. Função Principal ---
        async function atualizarMapa() {
            try {
                let altMin = document.getElementById('filtroAlt').value;

                const response = await fetch(`/api/aeronaves?min_alt=${altMin}`);
                if (!response.ok) throw new Error("Erro na API");
                const avioes = await response.json();

                let hexesNestaAtualizacao = new Set();
                let noMapa = 0;

                avioes.forEach(aviao => {
                    if (aviao.lat && aviao.lon) {
                        noMapa++;
                        hexesNestaAtualizacao.add(aviao.hex);

                        let bandeiraHTML = obterBandeira(aviao.hex);
                        let rumo = aviao.track || 0; // Se não tiver rumo, assume 0 (Norte)

                        // Conteúdo HTML do Popup
                        let info = `
                            <div style="font-family: Arial, sans-serif; min-width: 220px;">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                    <div style="display: flex; align-items: center;">
                                        <h2 style="margin:0; color:#0056b3; font-size: 1.3em;">
                                            ${aviao.flight || 'N/A'}
                                        </h2>
                                        ${bandeiraHTML}
                                    </div>
                                    <span style="background:#eee; padding: 2px 5px; border-radius: 4px; font-size: 0.8em; font-family: monospace;">
                                        ${aviao.hex}
                                    </span>
                                </div>
                                
                                <table style="width: 100%; font-size: 0.9em; color: #333; border-top: 1px solid #eee; padding-top:5px;">
                                    <tr><td><b>Alt:</b></td><td style="text-align: right;">${aviao.altitude} ft</td></tr>
                                    <tr><td><b>Vel:</b></td><td style="text-align: right;">${aviao.speed} kt</td></tr>
                                    <tr><td><b>Rumo:</b></td><td style="text-align: right;">${aviao.track}°</td></tr>
                                    <tr><td><b>Squawk:</b></td><td style="text-align: right;">${aviao.squawk || 'N/A'}</td></tr>
                                    <tr><td><b>Lat/Lon:</b></td><td style="text-align: right;">${aviao.lat.toFixed(3)}, ${aviao.lon.toFixed(3)}</td></tr>
                                </table>
                            </div>
                        `;

                        // Cria o ícone rodado
                        let novoIcone = criarIconeAviao(rumo);

                        if (markers[aviao.hex]) {
                            // ATUALIZAÇÃO:
                            // 1. Move a posição
                            markers[aviao.hex].setLatLng([aviao.lat, aviao.lon]);
                            // 2. Atualiza o ícone (para rodar a direção nova)
                            markers[aviao.hex].setIcon(novoIcone);
                            // 3. Atualiza o texto do popup
                            markers[aviao.hex].setPopupContent(info);
                        } else {
                            // CRIAÇÃO:
                            let m = L.marker([aviao.lat, aviao.lon], {icon: novoIcone})
                                     .bindPopup(info)
                                     .addTo(map);
                            markers[aviao.hex] = m;
                        }
                    }
                });

                // Limpeza
                for (let hexExistente in markers) {
                    if (!hexesNestaAtualizacao.has(hexExistente)) {
                        map.removeLayer(markers[hexExistente]);
                        delete markers[hexExistente];
                    }
                }

                document.getElementById('status').innerHTML = 
                    `Detetados: <b>${avioes.length}</b> | No Mapa: <b>${noMapa}</b>`;

            } catch (e) {
                console.error("Erro no JS:", e);
            }
        }

        // Atualiza a cada 1 segundo para o movimento ser suave
        setInterval(atualizarMapa, 1000);
        atualizarMapa();

    </script>
</body>
</html>
